name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache voice and embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/doodle-models
          key: models-v1-${{ runner.os }}
      - name: Unit tests
        env:
          DOODLE_MODELS: ~/.cache/doodle-models
        run: pytest -q
      - name: Smoke video (a 20-second script, offline director)
        env:
          DOODLE_MODELS: ~/.cache/doodle-models
        run: |
          doodle setup --lang en
          doodle make tests/fixtures/tiny.md -o smoke --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            smoke/*.mp4
            smoke/build/qa.json
            smoke/build/contact-sheet.jpg

  installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write          # attach the installers to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install -e . pyinstaller
          pyinstaller packaging/doodle.spec --noconfirm
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../DoodleStudio-${{ github.ref_name }}-windows.zip" "Doodle Studio"; \
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent "Doodle Studio.app" "../DoodleStudio-${{ github.ref_name }}-macos.zip"; \
          else tar czf "../DoodleStudio-${{ github.ref_name }}-linux.tar.gz" "Doodle Studio"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: DoodleStudio-*
